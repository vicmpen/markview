<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown Reader</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1e8;
      --surface: #ffffff;
      --surface-soft: #fbfaf5;
      --text: #1d2529;
      --muted: #5e6970;
      --border: #d7dcd5;
      --accent: #0f6b57;
      --accent-strong: #094d40;
      --warm: #9a551e;
      --shadow: 0 14px 38px rgba(29, 37, 41, 0.08);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--sans);
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
    }

    button {
      font: inherit;
    }

    .page {
      width: min(1280px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 48px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
      margin-bottom: 24px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent-strong);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.5rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .intro {
      max-width: 780px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 1.02rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 14px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      color: #ffffff;
      background: var(--accent);
      font-weight: 800;
      cursor: pointer;
    }

    .button:hover,
    .button:focus-visible {
      background: var(--accent-strong);
      outline: none;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(112px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
    }

    .stat strong {
      display: block;
      font-size: 1.55rem;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .status {
      min-height: 24px;
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .layout.selector-hidden {
      grid-template-columns: minmax(0, 1fr);
    }

    .document-list {
      position: sticky;
      top: 18px;
      display: grid;
      gap: 12px;
    }

    .layout.selector-hidden .document-list {
      display: none;
    }

    .doc-button {
      display: grid;
      gap: 10px;
      width: 100%;
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(29, 37, 41, 0.05);
      text-align: left;
      cursor: pointer;
    }

    .doc-button:hover,
    .doc-button:focus-visible {
      border-color: rgba(15, 107, 87, 0.55);
      outline: none;
    }

    .doc-button[aria-current="true"] {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 107, 87, 0.14), var(--shadow);
    }

    .doc-kicker {
      color: var(--warm);
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .doc-name {
      color: #26343a;
      font-size: 1rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .doc-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .doc-meta li,
    .reader-meta li {
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: #34454c;
      background: var(--surface-soft);
      font-size: 0.78rem;
      white-space: nowrap;
    }

    .reader {
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .reader-header {
      padding: 24px 28px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-soft);
    }

    .reader-header h2 {
      margin: 0;
      color: #26343a;
      font-size: clamp(1.45rem, 3vw, 2.3rem);
      line-height: 1.12;
      letter-spacing: 0;
    }

    .reader-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
    }

    .markdown-body {
      padding: 28px;
      overflow-x: auto;
    }

    .markdown-body > :first-child {
      margin-top: 0;
    }

    .markdown-body > :last-child {
      margin-bottom: 0;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      margin: 1.45em 0 0.55em;
      color: #26343a;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .markdown-body h1 {
      font-size: 2rem;
      padding-bottom: 0.35em;
      border-bottom: 1px solid var(--border);
    }

    .markdown-body h2 {
      font-size: 1.55rem;
      padding-bottom: 0.28em;
      border-bottom: 1px solid var(--border);
    }

    .markdown-body h3 {
      font-size: 1.2rem;
    }

    .markdown-body p,
    .markdown-body ul,
    .markdown-body ol,
    .markdown-body blockquote,
    .markdown-body table,
    .markdown-body pre {
      margin: 0 0 1rem;
    }

    .markdown-body ul,
    .markdown-body ol {
      padding-left: 1.35rem;
    }

    .markdown-body li + li {
      margin-top: 0.32rem;
    }

    .markdown-body a {
      color: var(--accent-strong);
      font-weight: 700;
    }

    .markdown-body code {
      padding: 0.12em 0.35em;
      border-radius: 5px;
      background: #edf2ee;
      font-family: var(--mono);
      font-size: 0.9em;
    }

    .markdown-body pre {
      overflow-x: auto;
      padding: 16px;
      border: 1px solid #cbd6cf;
      border-radius: 8px;
      background: #17231f;
      color: #eef8f2;
    }

    .markdown-body pre code {
      padding: 0;
      background: transparent;
      color: inherit;
      font-size: 0.88rem;
    }

    .markdown-body blockquote {
      padding: 10px 16px;
      border-left: 4px solid var(--accent);
      background: #f1f6f2;
      color: #3f4d53;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }

    .markdown-body th,
    .markdown-body td {
      padding: 9px 10px;
      border: 1px solid var(--border);
      vertical-align: top;
      text-align: left;
    }

    .markdown-body th {
      background: #eef3ed;
      color: #26343a;
    }

    .markdown-body tr:nth-child(even) td {
      background: #fbfcf9;
    }

    .empty {
      padding: 28px;
      color: var(--muted);
    }

    @media (max-width: 980px) {
      .topbar,
      .layout {
        grid-template-columns: 1fr;
      }

      .actions {
        justify-content: flex-start;
      }

      .document-list {
        position: static;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      .page {
        width: min(100% - 24px, 1280px);
        padding: 28px 0;
      }

      .stats,
      .document-list {
        grid-template-columns: 1fr;
      }

      .reader-header,
      .markdown-body,
      .empty {
        padding: 20px;
      }

      .doc-meta li,
      .reader-meta li {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <p class="eyebrow">Markdown reader</p>
        <h1>Markdown documents</h1>
        <p class="intro">The page scans the target directory on every load and renders each Markdown file as HTML.</p>
      </div>
      <div class="actions">
        <button class="button" type="button" id="toggle-selector-button" aria-controls="document-list" aria-expanded="true">Hide selector</button>
        <button class="button" type="button" id="refresh-button">Refresh scan</button>
      </div>
    </header>

    <section class="stats" aria-label="Directory summary">
      <div class="stat">
        <strong id="file-count">0</strong>
        <span>Markdown files</span>
      </div>
      <div class="stat">
        <strong id="line-count">0</strong>
        <span>Total lines</span>
      </div>
      <div class="stat">
        <strong id="section-count">0</strong>
        <span>Main sections</span>
      </div>
    </section>

    <p class="status" id="status" role="status">Scanning markdown files...</p>

    <section class="layout" id="document-layout" aria-label="Markdown documents">
      <nav class="document-list" id="document-list" aria-label="Documents"></nav>

      <article class="reader" id="document-viewer" aria-live="polite">
        <header class="reader-header">
          <p class="eyebrow" id="doc-kicker">No document selected</p>
          <h2 id="doc-title">Scanning...</h2>
          <ul class="reader-meta" id="doc-meta"></ul>
        </header>
        <div class="markdown-body" id="rendered-markdown"></div>
      </article>
    </section>
  </main>

  <script src="/vendor/marked.umd.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script>
    (function () {
      'use strict';

      const endpoint = '/api/markdown-files';
      const layout = document.getElementById('document-layout');
      const list = document.getElementById('document-list');
      const viewer = document.getElementById('rendered-markdown');
      const title = document.getElementById('doc-title');
      const kicker = document.getElementById('doc-kicker');
      const meta = document.getElementById('doc-meta');
      const status = document.getElementById('status');
      const toggleSelectorButton = document.getElementById('toggle-selector-button');
      const refreshButton = document.getElementById('refresh-button');
      const fileCount = document.getElementById('file-count');
      const lineCount = document.getElementById('line-count');
      const sectionCount = document.getElementById('section-count');
      let documents = [];

      function setStatus(message) {
        status.textContent = message;
      }

      function setSelectorVisible(isVisible) {
        layout.classList.toggle('selector-hidden', !isVisible);
        toggleSelectorButton.setAttribute('aria-expanded', String(isVisible));
        toggleSelectorButton.textContent = isVisible ? 'Hide selector' : 'Show selector';
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function escapeAttribute(value) {
        return escapeHtml(value).replace(/\x60/g, '&#96;');
      }

      function renderMarkdown(markdown) {
        const html = window.marked.parse(markdown);
        return window.DOMPurify ? window.DOMPurify.sanitize(html) : html;
      }

      function setStats() {
        fileCount.textContent = String(documents.length);
        lineCount.textContent = String(documents.reduce(function (sum, doc) {
          return sum + doc.lineCount;
        }, 0));
        sectionCount.textContent = String(documents.reduce(function (sum, doc) {
          return sum + doc.sectionCount;
        }, 0));
      }

      function renderDocumentList() {
        list.innerHTML = documents.map(function (doc) {
          return '<button class="doc-button" type="button" data-doc-id="' + escapeAttribute(doc.id) + '">' +
            '<span class="doc-kicker">Markdown file</span>' +
            '<span class="doc-name">' + escapeHtml(doc.title) + '</span>' +
            '<ul class="doc-meta" aria-label="File details">' +
              '<li>' + escapeHtml(doc.filename) + '</li>' +
              '<li>' + doc.lineCount + ' lines</li>' +
              '<li>' + doc.sectionCount + ' sections</li>' +
            '</ul>' +
          '</button>';
        }).join('');
      }

      function renderDocument(docId, updateHash) {
        const doc = documents.find(function (item) {
          return item.id === docId;
        }) || documents[0];

        if (!doc) {
          kicker.textContent = 'No markdown files';
          title.textContent = 'Nothing to render';
          meta.innerHTML = '';
          viewer.innerHTML = '<div class="empty">No Markdown files were found in this directory.</div>';
          return;
        }

        kicker.textContent = 'Markdown file';
        title.textContent = doc.title;
        meta.innerHTML = [doc.filename, doc.lineCount + ' lines', doc.sectionCount + ' sections']
          .map(function (item) {
            return '<li>' + escapeHtml(item) + '</li>';
          })
          .join('');
        viewer.innerHTML = renderMarkdown(doc.markdown);

        Array.from(list.querySelectorAll('.doc-button')).forEach(function (button) {
          button.setAttribute('aria-current', button.dataset.docId === doc.id ? 'true' : 'false');
        });

        if (updateHash) {
          history.replaceState(null, '', '#' + doc.id);
        }
      }

      async function loadDocuments(preferredId) {
        if (!window.marked || typeof window.marked.parse !== 'function') {
          throw new Error('Marked could not be loaded.');
        }

        setStatus('Scanning markdown files...');
        const response = await fetch(endpoint, { cache: 'no-store' });
        if (!response.ok) {
          throw new Error('Scan request failed with HTTP ' + response.status + '.');
        }

        documents = await response.json();
        setStats();
        renderDocumentList();
        renderDocument(preferredId || (location.hash ? location.hash.slice(1) : null), false);
        setStatus('Last scan loaded ' + documents.length + ' Markdown file' + (documents.length === 1 ? '.' : 's.'));
      }

      async function refresh(preferredId) {
        refreshButton.disabled = true;
        try {
          await loadDocuments(preferredId);
        } catch (error) {
          documents = [];
          setStats();
          list.innerHTML = '';
          kicker.textContent = 'Scan unavailable';
          title.textContent = 'Start the local server';
          meta.innerHTML = '';
          viewer.innerHTML = '<div class="empty">' + escapeHtml(error.message) + '<br>Is the md-preview server still running?</div>';
          setStatus('Scan failed.');
        } finally {
          refreshButton.disabled = false;
        }
      }

      refreshButton.addEventListener('click', function () {
        refresh(location.hash ? location.hash.slice(1) : null);
      });

      toggleSelectorButton.addEventListener('click', function () {
        setSelectorVisible(layout.classList.contains('selector-hidden'));
      });

      list.addEventListener('click', function (event) {
        const button = event.target.closest('.doc-button');
        if (!button) {
          return;
        }
        renderDocument(button.dataset.docId, true);
      });

      window.addEventListener('hashchange', function () {
        renderDocument(location.hash.slice(1), false);
      });

      refresh();
    }());
  </script>
</body>
</html>
